name: Check website
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node --check app.js
      - run: node --check basket-explorer.js
      - run: node --check quote-compare.js
      - run: node --check quote-compare-model.js
